# This workflow is managed by gh actions-lock.
# SPDX-License-Identifier: MPL-2.0
name: Hypatia Security Scan

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master]
  schedule:
    - cron: '0 0 * * 0'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  # The reusable declares security-events: write (it uploads SARIF). A called
  # workflow cannot escalate beyond the caller's grant, so `read` here makes the
  # whole run a startup_failure with zero jobs and no log.
  security-events: write

jobs:
  scan:
    uses: hyperpolymath/standards/.github/workflows/hypatia-scan-reusable.yml@fcb566cfb8a86cea2d3666bf65a4f177a49b1313
    with:
      block-on-high: true
